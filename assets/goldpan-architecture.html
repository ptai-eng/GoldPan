<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldPan AI · System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0C0A09;
      --color-ink:     #F5F5F4;
      --color-muted:   #A8A29E;
      --color-accent:  #FACC15;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">System Architecture · GoldPan AI v2.0</p>
    <h1>Dual-Mode Multimodal Refinery &amp; Local RAG Pipeline</h1>

    <svg viewBox="0 0 1060 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goldpan-arch-title goldpan-arch-desc">

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#60A5FA"/>
        </marker>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#0C0A09"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <text x="152" y="60" fill="#A8A29E" font-size="8" font-family="'Geist Mono', monospace"

      <!-- Zone 2: Dual-Mode Refinery Pipeline -->
      <rect x="336" y="48" width="388" height="236" rx="8"
            fill="rgba(250,204,21,0.02)" stroke="rgba(250,204,21,0.22)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="444" y="52" width="172" height="12" rx="4" fill="#0C0A09"/>
      <text x="530" y="60" fill="#FACC15" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">02 · REFINERY PIPELINE</text>

      <!-- Zone 3: Dual-Mode Vector KB & RAG -->
      <rect x="796" y="48" width="224" height="352" rx="8"
            fill="rgba(245,245,244,0.02)" stroke="rgba(245,245,244,0.12)" stroke-width="0.8"/>

      <text x="908" y="60" fill="#A8A29E" font-size="8" font-family="'Geist Mono', monospace"

      <!-- 5. Semantic Chunker -> ChromaDB Dual Store (exit bottom x=532,y=256 -> route right to x=756 -> up to y=120 -> enter left of ChromaDB x=816,y=120) -->

      <text x="84" y="328" fill="#A8A29E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
      <text x="152" y="348" fill="#F5F5F4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next.js 16 Workspace</text>
      <text x="152" y="364" fill="#A8A29E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">React 19 · Tailwind v4 :3000</text>

      <!-- Node 4: Heuristic & Semantic Filter (Focal 1) -->
      <rect x="356" y="88" width="160" height="64" rx="6" fill="#0C0A09"/>

      <text x="382" y="104" fill="#FACC15" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIFT</text>

      <rect x="816" y="312" width="184" height="64" rx="6" fill="#0C0A09"/>
