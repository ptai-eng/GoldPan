[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goldpan"
version = "3.0.0"
description = "Privacy-First Multimodal Data Refinery, Multilingual E5 ONNX + SQLite FTS5 RAG, Agent Context Firewall & MCP Server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hoang Kim Phat Tai", email = "phattai09052006@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "markitdown>=0.1.6",
    "pdfplumber>=0.11.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.45.0",
    "youtube-transcript-api>=1.0.0",
    "chromadb>=1.0.0",
    "onnxruntime>=1.19.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
    "requests>=2.32.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
directml = ["onnxruntime-directml>=1.19.0"]
cuda = ["onnxruntime-gpu>=1.19.0"]
openvino = ["onnxruntime-openvino>=1.19.0"]
coreml = ["onnxruntime-silicon>=1.16.0; sys_platform == 'darwin'"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
goldpan = "goldpan.cli:app"
goldpan-mcp = "goldpan.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["goldpan*"]

[tool.setuptools.package-data]
"goldpan.bench.datasets" = ["*.json"]
